name: Telegram Changes Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Rich Message delivery test to the configured Telegram channel"
        required: false
        type: boolean
        default: false
      replay_notifications:
        description: "Replay missed notifications for already committed production/test changes"
        required: false
        type: boolean
        default: false
      replay_prod_commit:
        description: "Existing production data-repository commit SHA to replay"
        required: false
        type: string
        default: "39d83a06f6f3e4b561848623093f70dcc18bd594"
      replay_test_commit:
        description: "Existing test data-repository commit SHA to replay"
        required: false
        type: string
        default: "b334350139314ceb941ed3f1bff6ff7174e2554e"

concurrency:
  group: telegram-changes-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Report trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "Workflow event: $EVENT_NAME"
          echo "Schedule: ${SCHEDULE:-manual}"
          echo "Run ID: $RUN_ID"
          echo "Run attempt: $RUN_ATTEMPT"
          date -u '+UTC time: %Y-%m-%d %H:%M:%S'
      - name: Check out checker
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Clone common data repository
        env:
          DATA_REPOSITORY_URL: ${{ secrets.DATA_REPOSITORY_URL }}
          DATA_REPOSITORY_TOKEN: ${{ secrets.DATA_REPOSITORY_TOKEN }}
        run: |
          REPO_PATH="${DATA_REPOSITORY_URL#https://github.com/}"
          git clone --branch main "https://x-access-token:${DATA_REPOSITORY_TOKEN}@github.com/${REPO_PATH}" data-repository
          git -C data-repository config user.name "Telegram Changes Checker"
          git -C data-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run checker
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PROD: ${{ secrets.TELEGRAM_SESSION_PROD }}
          TELEGRAM_SESSION_TEST: ${{ secrets.TELEGRAM_SESSION_TEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN_PROD: ${{ secrets.TG_BOT_TOKEN_PROD }}
          TG_NOTIFICATION_CHANNEL: ${{ vars.TG_NOTIFICATION_CHANNEL }}
          DATA_REPOSITORY_URL: ${{ secrets.DATA_REPOSITORY_URL }}
          DATA_REPOSITORY_BRANCH: main
          DATA_REPOSITORY_DIR: data-repository
          RESOURCE_WATCHER_RUN_ONCE: "1"
          RESOURCE_WATCHER_TEST_NOTIFICATION: ${{ inputs.test_notification && '1' || '0' }}
          RESOURCE_WATCHER_ENVIRONMENTS: "prod,test"
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.1-flash-lite
        run: python main.py

      - name: Replay missed Telegram notifications
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_notifications }}
        env:
          DATA_REPOSITORY_URL: ${{ secrets.DATA_REPOSITORY_URL }}
          DATA_REPOSITORY_DIR: data-repository
          TG_BOT_TOKEN_PROD: ${{ secrets.TG_BOT_TOKEN_PROD }}
          TG_NOTIFICATION_CHANNEL: ${{ vars.TG_NOTIFICATION_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.1-flash-lite
        run: |
          python replay_notifications.py \
            --prod-commit "${{ inputs.replay_prod_commit }}" \
            --test-commit "${{ inputs.replay_test_commit }}"

      - name: Persist private checker state
        if: success()
        run: |
          if [ ! -d ".state" ]; then
            echo "No private checker state directory yet."
            exit 0
          fi

          if git diff --quiet -- .state && \
             [ -z "$(git ls-files --others --exclude-standard -- .state)" ]; then
            echo "Private checker state is unchanged."
            exit 0
          fi

          git config user.name "Telegram Changes Checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .state

          if git diff --cached --quiet; then
            echo "No checker state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist checker state"
          branch="${GITHUB_REF_NAME}"

          # Rebase the state commit onto the latest branch head before pushing.
          # Retry if another commit lands between fetch/rebase and push.
          for attempt in 1 2 3 4 5; do
            echo "Persist attempt ${attempt}/5: syncing with origin/${branch}"
            git fetch origin "${branch}:refs/remotes/origin/${branch}"

            if ! git rebase "refs/remotes/origin/${branch}"; then
              git rebase --abort || true
              echo "::error::Could not rebase checker state onto origin/${branch}; refusing to overwrite remote changes."
              exit 1
            fi

            if git push origin "HEAD:${branch}"; then
              echo "Checker state persisted successfully."
              exit 0
            fi

            echo "Push was rejected because the branch moved; refreshing and retrying."
          done

          echo "::error::Could not persist checker state after 5 safe push attempts."
          exit 1
